name: Daily SEO article

on:
  schedule:
    - cron: "17 5 * * *"   # כל יום ב-07:17 שעון ישראל (חורף)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-article
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    env:
      # true = מפרסם ישר לאתר. false = פותח Pull Request לאישור ידני לפני פרסום
      AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH || 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate article
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_URL: https://thegraydome.com
        run: node bot/generate.mjs
      - name: Publish directly
        if: env.AUTO_PUBLISH == 'true'
        run: |
          git config user.name "tgd-content-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A blog sitemap.xml robots.txt bot/posts.json
          git diff --cached --quiet && exit 0
          git commit -m "מאמר יומי: ${{ steps.gen.outputs.title }}"
          git push
      - name: Open PR for review
        if: env.AUTO_PUBLISH != 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: article/${{ steps.gen.outputs.slug }}
          title: "מאמר לאישור: ${{ steps.gen.outputs.title }}"
          commit-message: "מאמר: ${{ steps.gen.outputs.title }}"
          body: "מאמר חדש מהבוט. בדקו, ערכו אם צריך ומזגו כדי לפרסם."
